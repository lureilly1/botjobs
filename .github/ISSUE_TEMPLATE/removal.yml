name: Correction or removal
description: Ask for a listing to be fixed or taken down.
labels: [removal]
body:
  - type: markdown
    attributes:
      value: |
        **You do not need an account for this.** [botjobs.dev/report](https://botjobs.dev/report)
        takes the same request without one.

        If you made a bot listed here and you want it gone, say so. We will not ask
        you to justify it and we will not try to talk you out of it. Removals are
        actioned within 48 hours.
  - type: input
    id: listing
    attributes:
      label: Which listing?
      placeholder: https://botjobs.dev/grok-bot/bots/...
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: What are you asking for?
      options:
        - Take the listing down
        - Fix something that is wrong
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Anything else?
      description: Optional. "I made this and want it gone" is a complete request.
