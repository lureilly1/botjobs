# fly.toml app configuration file generated for botjobs on 2026-09-02T20:53:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'botjobs'
# Must be the region the volume is in — a machine can only attach a volume in
# its own region, so a mismatch fails the deploy. The volume was created in cdg.
primary_region = 'cdg'

[build]
[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '8080'

# Fly holds a persistent volume, which the serverless free tiers do not. Without
# one, every submission and every analytics event is lost on each deploy — and
# submissions are the whole point of the /submit and /report forms.
#
# One machine, because the volume attaches to one machine. That is the right
# trade at this size: a single writer means the JSON store needs no locking.
[[mounts]]
  source = 'botjobs_data'
  destination = '/data'

[http_service]
  # Must match PORT above. `fly launch` guesses this from astro.config.mjs and
  # picks 4321, which is the DEV port — the built server listens on whatever
  # PORT says. Leave them disagreeing and every request is a 502.
  internal_port = 8080
  force_https = true
  # Scale to zero when idle and suspend rather than stop, so a cold request
  # resumes the machine instead of booting it. A directory gets long quiet
  # stretches and paying for them is pointless.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
