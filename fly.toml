# fly.toml app configuration file generated for botjobs on 2026-09-02T20:53:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'botjobs'
# Must be the region the attached volume is in — a machine can only mount a
# volume in its own region. The machine and its volume are both in lhr.
primary_region = 'lhr'

[build]
[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '8080'

# Fly holds a persistent volume, which the serverless free tiers do not. Without
# one, every submission and every analytics event is lost on each deploy — and
# submissions are the whole point of the /submit and /report forms.
#
# One machine, because the volume attaches to one machine. That is the right
# trade at this size: a single writer means the JSON store needs no locking.
[[mounts]]
  source = 'botjobs_data'
  destination = '/data'

[http_service]
  # Must match PORT above. `fly launch` guesses this from astro.config.mjs and
  # picks 4321, which is the DEV port — the built server listens on whatever
  # PORT says. Leave them disagreeing and every request is a 502.
  internal_port = 8080
  force_https = true
  # Suspend rather than stop, so a request that arrives cold resumes the machine
  # instead of booting it.
  auto_stop_machines = 'suspend'
  auto_start_machines = true

  # One machine stays up. This was 0, and scaling to zero is the wrong trade
  # while the site is trying to get indexed.
  #
  # Google's own explanation of "Discovered - currently not indexed" names
  # server responsiveness: it wanted to crawl the URL, expected that to overload
  # the site, and rescheduled the crawl. A directory this quiet is suspended
  # almost every time Googlebot arrives, so nearly every crawl pays a resume —
  # on the first request, which is the one being measured.
  #
  # This is not the main reason 37 of 38 pages sit undiscovered; a site weeks
  # old with no referring domains has a demand problem no config fixes. It is
  # the part that is ours, it is a plausible contributor, and it is one line.
  #
  # It costs money: one shared-cpu-1x/512mb running continuously rather than
  # only when someone visits. Revert to 0 if that is not worth it — the site
  # behaves identically either way, just slower on the first hit.
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
